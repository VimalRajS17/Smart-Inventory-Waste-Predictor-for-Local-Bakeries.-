{% extends "base.html" %}

{% block title %}Session Expired — Loaf Ledger{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto; text-align: center;">
  <div class="card" style="padding: 2.5rem 1.5rem;">
    <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">🛡️</span>
    <h2 style="font-family: var(--font-serif); font-size: 1.6rem; color: var(--text-primary); margin-bottom: 0.5rem;">
      Security Check Failed
    </h2>
    <p style="font-size: 0.92rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 1.5rem;">
      {{ reason or 'The session token was missing or expired. This happens when a page has been open for a while.' }}
    </p>
    <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
      <a href="javascript:history.back()" class="btn btn-secondary btn-lg">← Go Back</a>
      <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg">Return to Login</a>
    </div>
  </div>
</div>
{% endblock %}
