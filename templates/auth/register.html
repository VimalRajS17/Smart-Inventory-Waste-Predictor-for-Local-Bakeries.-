{% extends "base.html" %}

{% block title %}Create Bakery Account — Loaf Ledger{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto; width: 100%;">
  <div class="card" style="padding: 2rem 1.5rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span style="font-size: 2.5rem; display: block; margin-bottom: 0.5rem;">🥐</span>
      <h2 style="font-family: var(--font-serif); font-size: 1.6rem; color: var(--text-primary); margin-bottom: 0.35rem;">
        Register Your Bakery
      </h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary);">
        Start forecasting daily demand and reducing spoilage.
      </p>
    </div>

    {% if error %}
    <div class="info-banner" style="background-color: var(--alert-bg); border-color: var(--alert); color: var(--alert-text); margin-bottom: 1.25rem;">
      <span class="info-banner-icon">⚠️</span>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label class="form-label" for="register-email-input">Email Address *</label>
        <input type="email" id="register-email-input" name="email" class="input-field input-lg" placeholder="baker@example.com" value="{{ email or '' }}" required autocomplete="email" autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label class="form-label" for="register-password-input">Password * (min 6 characters)</label>
        <input type="password" id="register-password-input" name="password" class="input-field input-lg" placeholder="••••••••" required autocomplete="new-password" minlength="6">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="register-confirm-password-input">Confirm Password *</label>
        <input type="password" id="register-confirm-password-input" name="confirm_password" class="input-field input-lg" placeholder="••••••••" required autocomplete="new-password" minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; min-height: 48px; font-weight: 600;">
        Create Account &amp; Setup Bakery
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      Already registered?
      <a href="{{ url_for('auth.login') }}" style="font-weight: 600; color: var(--accent);">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
