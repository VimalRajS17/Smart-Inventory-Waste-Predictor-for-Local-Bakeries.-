{% extends "base.html" %}

{% block title %}Bad Request (400) — Loaf Ledger{% endblock %}

{% block content %}
<div class="card" style="max-width:550px; margin:3rem auto; text-align:center; padding:2.5rem 2rem;">
  <div style="font-size:3.5rem; margin-bottom:1rem;">⚠️🍞</div>
  <h2 class="screen-title" style="margin-bottom:0.5rem;">Bad Request</h2>
  <p style="color:var(--text-secondary); margin-bottom:1.75rem; line-height:1.5;">
    {{ error or "The request could not be processed due to invalid parameters or formatting." }}
  </p>
  <div style="display:flex; justify-content:center; gap:0.75rem;">
    <a href="{{ url_for('plan_page') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary" style="min-height:44px; text-decoration:none; display:inline-flex; align-items:center;">
      Return to Bakery ➔
    </a>
  </div>
</div>
{% endblock %}
